apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
data:
  prometheus.yml: |-
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'catalog-api'
        metrics_path: /metrics
        static_configs:
          - targets: ['catalog-api:80']

      - job_name: 'basket-api'
        metrics_path: /metrics
        static_configs:
          - targets: ['basket-api:80']

      - job_name: 'discount-api'
        metrics_path: /metrics
        static_configs:
          - targets: ['discount-api:80']

      - job_name: 'ordering-api'
        metrics_path: /metrics
        static_configs:
          - targets: ['ordering-api:80']

      - job_name: 'ocelotapigw'
        metrics_path: /metrics
        static_configs:
          - targets: ['ocelotapigw:80'] 