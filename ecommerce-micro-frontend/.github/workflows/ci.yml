name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NODE_VERSION: "20"

jobs:
  main:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for NX affected commands and graph visualization

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Initialize Nx Cloud
        uses: nrwl/nx-set-shas@v4

      - name: Run lint
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha || 'main' }}
          npx nx affected --target=lint --parallel=3 --base=$BASE_SHA

      - name: Run type check
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha || 'main' }}
          npx nx affected --target=typecheck --parallel=3 --base=$BASE_SHA || echo "No typecheck target found, skipping"

      - name: Run tests
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha || 'main' }}
          npx nx affected --target=test --parallel=3 --ci --code-coverage --base=$BASE_SHA

      - name: Build affected apps
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha || 'main' }}
          npx nx affected --target=build --parallel=3 --base=$BASE_SHA

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Build all apps (required for E2E)
        run: npm run build:prod

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

