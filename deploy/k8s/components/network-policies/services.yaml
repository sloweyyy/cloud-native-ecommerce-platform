# Discount gRPC: called by Basket (gRPC) and routed by the gateway; uses PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discount
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: discount
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: basket
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ocelotapigw
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: discountdb
      ports:
        - protocol: TCP
          port: 5432
    # Serilog -> Elasticsearch (logging component)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - protocol: TCP
          port: 9200
    # OpenTelemetry traces -> Jaeger collector in istio-system (Otlp__Endpoint)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 4317
