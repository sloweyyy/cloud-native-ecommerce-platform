# LocalStack S3 - stands in for the AWS S3 product-images bucket so the Catalog
# service can run without AWS credentials (USE_LOCALSTACK=true in catalog-config).
# On AWS the Helm chart (deploy/helm/catalog/values-aws.yaml) targets real S3.
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/component: storage
data:
  # Executed by LocalStack once S3 is ready; mirrors scripts/init-localstack-s3.sh.
  01-create-bucket.sh: |
    #!/bin/sh
    awslocal s3 mb s3://ecommerce-product-images || true
    awslocal s3api put-bucket-acl --bucket ecommerce-product-images --acl public-read || true
---
apiVersion: v1
kind: Service
metadata:
  name: eshopping-localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/instance: eshopping-localstack
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/instance: eshopping-localstack
  ports:
    - name: http-edge
      port: 4566
      targetPort: edge
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshopping-localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/instance: eshopping-localstack
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
      app.kubernetes.io/instance: eshopping-localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        app.kubernetes.io/instance: eshopping-localstack
        app.kubernetes.io/component: storage
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: localstack
          image: localstack/localstack:3.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: edge
              containerPort: 4566
              protocol: TCP
          env:
            - name: SERVICES
              value: s3
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          envFrom:
            - secretRef:
                name: localstack-credentials
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d
      volumes:
        - name: init
          configMap:
            name: localstack-init
            defaultMode: 0755
