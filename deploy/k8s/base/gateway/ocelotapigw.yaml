# API Gateway - Ocelot
#
# Program.cs loads `ocelot.{ASPNETCORE_ENVIRONMENT}.json`; the ocelotapigw-config
# ConfigMap sets ASPNETCORE_ENVIRONMENT=k8s and the routes are mounted from the
# generated ocelotapigw-routes ConfigMap as /app/ocelot.k8s.json (kustomize adds
# a content hash to the name, so a routing change rolls the pods).
apiVersion: v1
kind: Service
metadata:
  name: eshopping-ocelotapigw
  labels:
    app.kubernetes.io/name: ocelotapigw
    app.kubernetes.io/instance: eshopping-ocelotapigw
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ocelotapigw
    app.kubernetes.io/instance: eshopping-ocelotapigw
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshopping-ocelotapigw
  labels:
    app.kubernetes.io/name: ocelotapigw
    app.kubernetes.io/instance: eshopping-ocelotapigw
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ocelotapigw
      app.kubernetes.io/instance: eshopping-ocelotapigw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocelotapigw
        app.kubernetes.io/instance: eshopping-ocelotapigw
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        # "app" user of the mcr.microsoft.com/dotnet/aspnet images.
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
        # The image listens on port 80 as a non-root user. Allow that without
        # NET_BIND_SERVICE (containerd < 2.0 does not do this by default).
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: ocelotapigw
          image: eshop/ocelot.apigw
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ocelotapigw-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          # /health/live and /health/ready are provided by the gateway's health
          # checks (liveness = process up, readiness = ready to route).
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: routes
              mountPath: /app/ocelot.k8s.json
              subPath: ocelot.k8s.json
              readOnly: true
      volumes:
        - name: routes
          configMap:
            name: ocelotapigw-routes
