# Basket cache - Redis with AOF persistence (StatefulSet + PVC)
apiVersion: v1
kind: Service
metadata:
  name: eshopping-basketdb
  labels:
    app.kubernetes.io/name: basketdb
    app.kubernetes.io/instance: eshopping-basketdb
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: basketdb
    app.kubernetes.io/instance: eshopping-basketdb
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eshopping-basketdb
  labels:
    app.kubernetes.io/name: basketdb
    app.kubernetes.io/instance: eshopping-basketdb
    app.kubernetes.io/component: database
spec:
  serviceName: eshopping-basketdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: basketdb
      app.kubernetes.io/instance: eshopping-basketdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: basketdb
        app.kubernetes.io/instance: eshopping-basketdb
        app.kubernetes.io/component: database
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
