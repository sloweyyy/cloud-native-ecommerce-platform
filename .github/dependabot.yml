version: 2
updates:
  # .NET NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sloweyyy"
    assignees:
      - "sloweyyy"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "dotnet"
    groups:
      # Batch all non-major NuGet bumps into a single PR to cut review noise.
      dotnet-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # npm packages for frontend
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sloweyyy"
    assignees:
      - "sloweyyy"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # Keep the whole Nx toolchain on the same version. Bumping @nx/* packages
      # individually previously left nx core and its plugins on different majors,
      # producing an out-of-sync package-lock.json that broke `npm ci` in CI.
      nx-monorepo:
        patterns:
          - "nx"
          - "@nx/*"
          - "@nrwl/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # npm packages for micro-frontend
  - package-ecosystem: "npm"
    directory: "/micro-frontends"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "sloweyyy"
    assignees:
      - "sloweyyy"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
      - "micro-frontend"
    groups:
      # Keep the whole Nx toolchain on the same version. Bumping @nx/* packages
      # individually previously left nx core and its plugins on different majors,
      # producing an out-of-sync package-lock.json that broke `npm ci` in CI.
      nx-monorepo:
        patterns:
          - "nx"
          - "@nx/*"
          - "@nrwl/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "sloweyyy"
    assignees:
      - "sloweyyy"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-images:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    reviewers:
      - "sloweyyy"
    assignees:
      - "sloweyyy"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
