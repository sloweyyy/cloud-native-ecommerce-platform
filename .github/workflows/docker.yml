---
name: Docker Build and Push

on:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  DOCKER_USERNAME: slowey
  GHCR_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: "catalog-api"
            path: "Services/Catalog/Catalog.API"
            cache-key: "catalog"
          - name: "basket-api"
            path: "Services/Basket/Basket.API"
            cache-key: "basket"
          - name: "discount-api"
            path: "Services/Discount/Discount.API"
            cache-key: "discount"
          - name: "ordering-api"
            path: "Services/Ordering/Ordering.API"
            cache-key: "ordering"
          - name: "ocelot-gateway"
            path: "ApiGateways/Ocelot.ApiGateway"
            cache-key: "ocelot"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login for both Docker Hub and GitHub Container Registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service.name }}
            ${{ env.REGISTRY }}/${{ env.GHCR_NAMESPACE }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.path }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: >-
            type=gha,scope=${{ github.workflow }}-${{ matrix.service.cache-key }}
          cache-to: >-
            type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.service.cache-key }}

  client-build:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: ./client
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_USERNAME }}/spa-client
            ${{ env.REGISTRY }}/${{ env.GHCR_NAMESPACE }}/spa-client
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push client Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: >-
            type=gha,scope=${{ github.workflow }}-client
          cache-to: >-
            type=gha,mode=max,scope=${{ github.workflow }}-client
