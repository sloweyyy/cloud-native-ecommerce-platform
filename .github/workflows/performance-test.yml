name: Performance Testing (K6)

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
      target_url:
        description: 'Target gateway URL (leave empty for default)'
        required: false
        type: string
  schedule:
    - cron: '0 4 * * MON'  # Weekly Monday 4 AM UTC (smoke test)

concurrency:
  group: perf-test
  cancel-in-progress: false

jobs:
  k6-test:
    name: K6 ${{ github.event.inputs.test_type || 'smoke' }} test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: discountdb
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'ci-test-password-only' }}
        ports:
          - 5432:5432
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install K6
        # Use the official Grafana action instead of the apt/keyserver method:
        # `gpg --recv-keys` from keyserver.ubuntu.com was intermittently failing
        # with "keyserver receive failed: No data", breaking every scheduled run.
        uses: grafana/setup-k6-action@v1

      - name: Build and start services
        run: |
          dotnet build Ecommerce.sln --configuration Release

          # Start all microservices in background
          cd Services/Catalog/Catalog.API && dotnet run --configuration Release --no-build --urls "http://0.0.0.0:8001" & cd ../../..
          cd Services/Basket/Basket.API && dotnet run --configuration Release --no-build --urls "http://0.0.0.0:8002" & cd ../../..
          cd Services/Ordering/Ordering.API && dotnet run --configuration Release --no-build --urls "http://0.0.0.0:8004" & cd ../../..

          # Start API Gateway
          cd ApiGateways/Ocelot.ApiGateway && dotnet run --configuration Release --no-build --urls "http://0.0.0.0:8010" & cd ../..

          # Wait for the gateway to accept connections. Ocelot exposes no /health
          # route, so treat ANY HTTP response (even 404) as "process is listening".
          echo "Waiting for API gateway to accept connections..."
          gateway_up=false
          for i in $(seq 1 45); do
            if curl -s -o /dev/null "http://localhost:8010/"; then
              gateway_up=true
              echo "Gateway responding after attempt ${i}."
              break
            fi
            sleep 2
          done
          if [ "$gateway_up" != "true" ]; then
            echo "::error::API gateway did not start within the timeout window"
            exit 1
          fi

      - name: Run K6 test
        env:
          TEST_TYPE: ${{ github.event.inputs.test_type || 'smoke' }}
          AWS_GATEWAY_URL: ${{ github.event.inputs.target_url || 'http://localhost:8010' }}
        run: |
          cd tests/k6
          # Map the requested test type to the script that actually exists in
          # tests/k6 (there is no generic "load-test.js").
          case "$TEST_TYPE" in
            smoke)  SCRIPT=gateway-smoke-test.js ;;
            stress) SCRIPT=stress-test.js ;;
            spike)  SCRIPT=spike-test.js ;;
            soak)   SCRIPT=soak-test.js ;;
            *)      SCRIPT=gateway-smoke-test.js ;;
          esac
          echo "Running k6 script '$SCRIPT' (test type: $TEST_TYPE)"
          k6 run \
            --out json=results.json \
            --tag testType=$TEST_TYPE \
            "$SCRIPT"

      - name: Generate test summary
        if: always()
        run: |
          echo "## K6 Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Type:** ${{ github.event.inputs.test_type || 'smoke' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tests/k6/results.json ]; then
            echo "Results file generated successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results-${{ github.event.inputs.test_type || 'smoke' }}-${{ github.run_number }}
          path: tests/k6/results.json
          retention-days: 30
